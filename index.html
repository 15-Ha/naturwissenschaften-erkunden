<style>
:root{
  --brand:#005F6A;--brand-dark:#00444C;--mint:#3EB489;--mint-soft:#E3F5EC;--mint-line:#A8DFC6;--mint-ink:#1E7454;
  --paper:#F2F7F7;--paper-deep:#D8E5E5;--card:#EFF4F4;--white:#fff;--line:#C6D8D8;
  --ink:#2E4A4C;--ink-soft:#43676A;--red:#C0392B;--red-soft:#FBECEA;--amber-soft:#FCF3DC;
  --serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --logo:url();
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--serif);color:var(--brand);line-height:1.2}
button{font-family:inherit}
.top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,3vw,28px);position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top img{width:44px;height:44px;background:#fff;border-radius:11px;padding:3px}
.top h1{margin:0;font-size:clamp(18px,2.6vw,24px);color:#fff}
.top .sub{font-size:13px;opacity:.85;margin-top:1px}
.top .grow{flex:1}
.menu-btn{display:none;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:8px 12px;font-weight:600;cursor:pointer}
.layout{display:grid;grid-template-columns:272px 1fr;gap:0;max-width:1320px;margin:0 auto;min-height:calc(100vh - 66px)}
nav{padding:18px 12px 30px 16px;position:sticky;top:66px;align-self:start;max-height:calc(100vh - 66px);overflow:auto}
nav .grp{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:16px 8px 6px}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:transparent;border-radius:10px;padding:9px 11px;font-size:14.5px;color:var(--ink);cursor:pointer;margin:1px 0}
nav button:hover{background:var(--paper-deep)}
nav button.on{background:var(--brand);color:#fff;font-weight:600}
nav button .n{flex:0 0 24px;height:24px;border-radius:7px;background:var(--paper-deep);color:var(--brand);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
nav button.on .n{background:rgba(255,255,255,.2);color:#fff}
main{padding:22px clamp(14px,3vw,34px) 60px;min-width:0}
.page-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px}
.page-h h2{margin:0;font-size:clamp(22px,3vw,30px)}
.lzchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;background:var(--mint-soft);color:var(--mint-ink);border:1px solid var(--mint-line);border-radius:999px;padding:3px 10px}
.tabs{display:inline-flex;gap:4px;background:var(--paper-deep);border-radius:12px;padding:4px;margin:12px 0 4px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;padding:9px 18px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink-soft)}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mint);border-radius:14px;padding:clamp(16px,3vw,28px);margin-top:14px}
.card.plain{border-left-color:var(--line);background:#fff}
.hello{font-size:17px;max-width:70ch}
.muted{color:var(--ink-soft);font-size:.92em}
/* Theorie */
.theory h3{font-size:19px;margin:22px 0 8px}
.theory h3:first-child{margin-top:0}
.theory p{margin:8px 0;max-width:75ch}
.theory ul,.theory ol{max-width:75ch;padding-left:22px}
.theory li{margin:4px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.box.tip{border-left:5px solid var(--mint);background:#F5FBF8}
.box.warn{border-left:5px solid #E0A020;background:var(--amber-soft)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.three.two{grid-template-columns:repeat(2,1fr)}
.two3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three .box,.two3 .box{margin:0}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14.5px;margin:10px 0}
.tbl th{background:var(--paper-deep);text-align:left;padding:8px 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.fig{display:flex;justify-content:center;margin:12px 0 4px}
.fig canvas{border:1px solid var(--line);border-radius:14px;background:#fff;max-width:100%;height:auto}
.cap{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.legend{columns:2;column-gap:28px;max-width:640px;margin:10px auto;font-size:15px}
.flames{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.steps2{counter-reset:s;list-style:none;padding:0!important}
.steps2 li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 48px;margin:7px 0;position:relative}
.steps2 li:before{content:counter(s);position:absolute;left:11px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tag{font-family:var(--sans);font-size:11px;font-weight:700;background:var(--amber-soft);border:1px solid #E9D39B;color:#846516;border-radius:999px;padding:2px 9px;vertical-align:middle;letter-spacing:.04em;text-transform:uppercase}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gal .g{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.gal canvas{max-width:100%;height:auto}
.gal b{display:block;font-family:var(--serif);color:var(--brand);font-size:17px}
.gal span{font-size:13px;color:var(--ink-soft);display:block;margin-top:3px}
/* Ueben */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:4px;background:var(--paper-deep);border-radius:10px;padding:4px}
.pill button{border:none;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-soft)}
.pill button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:none;cursor:pointer;font-weight:600;font-size:15px;padding:11px 22px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--brand);color:#fff}.btn.pri:hover:not(:disabled){filter:brightness(1.14)}
.btn.gho{background:var(--paper-deep);color:var(--brand)}.btn.gho:hover:not(:disabled){background:var(--line)}
.btn.mint{background:var(--mint);color:#fff}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.dots{display:flex;gap:5px;margin:10px 0 2px;flex-wrap:wrap}
.dots i{width:26px;height:8px;border-radius:5px;background:var(--line)}
.dots i.ok{background:var(--mint)}.dots i.bad{background:var(--red)}.dots i.cur{background:var(--brand)}
.q{font-family:var(--serif);font-size:clamp(19px,2.5vw,23px);line-height:1.45;margin:10px 0 4px}
.q .steps{font-family:var(--sans);font-size:16px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;line-height:1.9}
.subq{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:12px}
.stim{display:flex;justify-content:center;margin:10px 0}
.stim canvas{border:1px solid var(--line);border-radius:14px;background:#fff;max-width:100%;height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 15px;font-size:16px;text-align:left;cursor:pointer;color:var(--ink);line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--mint)}
.opt.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,95,106,.16);background:#F3FAFA}
.opt.right{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink);font-weight:600}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.pics .opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;font-weight:700}
.opts.pics canvas{max-width:100%;height:auto}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.ansrow input{font-size:19px;padding:11px 14px;border:2px solid var(--line);border-radius:10px;width:min(340px,100%);font-family:var(--sans);color:var(--ink);background:#fff}
.ansrow input:focus{outline:none;border-color:var(--brand)}
.ansrow input.right{border-color:var(--mint);background:var(--mint-soft)}.ansrow input.wrong{border-color:var(--red);background:var(--red-soft)}
.unit{font-family:var(--serif);font-size:19px}
.fb{margin-top:16px;padding:12px 15px;border-radius:11px;font-size:15.5px}
.fb.ok{background:var(--mint-soft);border:1px solid var(--mint-line);color:var(--mint-ink)}
.fb.no{background:var(--red-soft);border:1px solid #E7B3AC}
.nav2{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
/* Auswertung */
.proto h3{margin:20px 0 8px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.kpi{flex:1;min-width:100px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
.kpi b{display:block;font-family:var(--serif);font-size:26px;color:var(--brand);line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-soft)}
.assess{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px}
.item{background:#fff;border:1px solid var(--line);border-left:5px solid var(--mint);border-radius:10px;padding:10px 13px;margin:9px 0;break-inside:avoid}
.item.bad{border-left-color:var(--red)}
.item .h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);font-weight:600;gap:8px}
.item .qq{margin:5px 0;font-size:15px}
.item .qq .steps{display:none}
.item .aa{font-size:14px}
.item .wr{color:var(--red);font-weight:700}.item .ok2{color:var(--mint-ink);font-weight:700}
.item canvas{border:1px solid var(--line);border-radius:10px;max-width:150px;height:auto;margin:6px 0}
/* Start */
.lz{list-style:none;padding:0;margin:12px 0}
.lz li{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.lz li.done{background:var(--mint-soft);border-color:var(--mint-line)}
.lz input{width:22px;height:22px;accent-color:var(--brand);margin-top:3px;flex:none}
.lz .t{flex:1}.lz .t small{display:block;color:var(--ink-soft);font-size:12.5px}
.lz .go{flex:none;font-size:13px;padding:7px 12px}
.progress{height:10px;background:var(--paper-deep);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--mint);transition:width .3s}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;color:var(--ink)}
.tile:hover{border-color:var(--mint);box-shadow:0 4px 14px rgba(0,95,106,.12)}
.tile b{display:block;font-family:var(--serif);color:var(--brand);font-size:17px;margin-bottom:3px}
.tile span{font-size:13px;color:var(--ink-soft)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft)}
.field input[type=number],.field input[type=text]{font-size:15px;padding:9px 12px;border:2px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:110px}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.check input{width:18px;height:18px;accent-color:var(--brand)}
footer{max-width:1320px;margin:0 auto;padding:10px clamp(14px,3vw,34px) 30px;font-size:12.5px;color:var(--ink-soft)}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:block}
  nav{position:fixed;inset:66px 0 0 0;background:var(--paper);z-index:15;max-height:none;transform:translateX(-102%);transition:transform .22s;padding-bottom:60px}
  nav.open{transform:none}
  .three,.three.two,.two3{grid-template-columns:1fr}
  .legend{columns:1}
}
@media(max-width:520px){.opts{grid-template-columns:1fr}.tabs button{padding:8px 12px}.lz li{flex-wrap:wrap}}
@media print{
  body.printing *{visibility:hidden!important}
  body.printing .proto,body.printing .proto *{visibility:visible!important}
  body.printing .proto{position:absolute;left:0;top:0;width:100%;border:none;background:#fff;box-shadow:none}
  body.printing .noprint{display:none!important}
  .top,nav,footer{display:none!important}
}

</style>
</head>

<script>
/* ===== Hilfsfunktionen ===== */
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function without(a,x){return a.filter(function(v){return v!==x;});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function plain(h){return String(h||'').replace(/<br\s*\/?>/g,' ').replace(/<sup>/g,'^').replace(/<\/sup>/g,'').replace(/<[^>]+>/g,'')
  .replace(/&nbsp;/g,' ').replace(/&middot;/g,'·').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u')
  .replace(/é|è|ê/g,'e').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();}
function anyOf(list){return function(v){var n=norm(v);return !!n&&list.some(function(a){return norm(a)===n;});};}
function num(v){var s=String(v).replace(',','.').replace(/[^\d.\-]/g,'');var x=parseFloat(s);return isNaN(x)?null:x;}
function fmt(x){return String(Math.round(x*1000)/1000).replace('.',',');}
function letters(n){var o=[];for(var i=0;i<n;i++)o.push(String.fromCharCode(65+i));return o;}

/* ===== Aufgabenbausteine ===== */
// Auswahl per Knopf (Text-Antworten, ggf. mit Bild)
function choice(sub,prompt,correct,wrongs,o){
  o=o||{};
  var opts=shuffle([correct].concat(wrongs)).map(function(l){return {label:l,correct:l===correct};});
  var t={sub:sub,answerType:'buttons',promptHTML:prompt,options:opts,pdfQ:plain(prompt),answerText:correct,
    solutionHTML:o.sol||('<b>'+esc(correct)+'</b>'),pdfSol:o.pdfSol||correct};
  for(var k in o){if(k!=='sol')t[k]=o[k];}
  return t;
}
// Freie Eingabe
function typed(sub,prompt,answers,o){
  o=o||{};
  var a=Array.isArray(answers)?answers:[answers];
  var t={sub:sub,answerType:'text',promptHTML:prompt,pdfQ:plain(prompt),accept:anyOf(a),answerText:a[0],
    solutionHTML:o.sol||('<b>'+esc(a[0])+'</b>'),pdfSol:o.pdfSol||a[0],placeholder:o.placeholder||'Antwort'};
  for(var k in o){if(k!=='sol')t[k]=o[k];}
  return t;
}
function typedNum(sub,prompt,value,unit,o){
  o=o||{};
  var t={sub:sub,answerType:'text',promptHTML:prompt,pdfQ:plain(prompt),inputMode:'decimal',unit:unit,placeholder:'Zahl',
    accept:function(v){var x=num(v);return x!==null&&Math.abs(x-value)<=Math.max(1e-9,Math.abs(value)*1e-6);},
    answerText:fmt(value),solutionHTML:o.sol||('<b>'+fmt(value)+(unit?' '+esc(unit):'')+'</b>'),pdfSol:o.pdfSol||(fmt(value)+(unit?' '+unit:''))};
  for(var k in o){if(k!=='sol')t[k]=o[k];}
  return t;
}
// Reihenfolge: Schritte werden mit Buchstaben versehen, Antwort = Buchstabenfolge
function ordering(sub,prompt,steps,o){
  o=o||{};
  var shuf=shuffle(steps.map(function(s,i){return {s:s,i:i};}));
  var L=letters(steps.length);
  var correct=steps.map(function(_,i){for(var k=0;k<shuf.length;k++)if(shuf[k].i===i)return L[k];}).join('');
  var list=shuf.map(function(x,k){return '<b>'+L[k]+'</b>&nbsp; '+esc(x.s);}).join('<br>');
  var pdfList=shuf.map(function(x,k){return L[k]+') '+x.s;});
  var t={sub:sub,answerType:'text',promptHTML:prompt+'<div class="steps">'+list+'</div>',
    pdfQ:plain(prompt)+'\n'+pdfList.join('\n'),placeholder:'z. B. '+L.join(''),
    accept:function(v){return String(v).toUpperCase().replace(/[^A-Z]/g,'')===correct;},
    answerText:correct.split('').join(' '),pdfSol:correct.split('').join(' ')+'  ('+steps.join(' > ')+')',
    solutionHTML:'<b>'+correct.split('').join(' ')+'</b> &nbsp;('+steps.map(esc).join(' &rarr; ')+')'};
  for(var k in o)t[k]=o[k];
  return t;
}
function wrongs(pool,correct,n){return sample(pool.filter(function(x){return x!==correct;}),n);}
// Aufgaben mit Bild (Zeichnung)
function withImg(t,fn,size,wmm){
  t.stim=function(c,s){frame(c,s,fn);};t.stimSize=size||240;
  t.pdfImg={draw:function(c,px){frame(c,px,fn);},w:wmm||60,ratio:1};
  return t;
}
// Wahl zwischen gezeichneten Bildern (mc)
function pictureChoice(sub,prompt,items,correctIdx,o){
  o=o||{};
  var idx=shuffle(items.map(function(_,i){return i;}));
  var opts=idx.map(function(i){return {correct:i===correctIdx,draw:function(c,s){frame(c,s,items[i]);},size:o.size||130,label:''};});
  var pos=idx.indexOf(correctIdx);
  var t={sub:sub,answerType:'mc',promptHTML:prompt,pdfQ:plain(prompt),options:opts,
    pdfOpts:opts.map(function(op){return {draw:function(c,px){frame(c,px,items[idx[opts.indexOf(op)]]);},ratio:1};}),
    answerText:String.fromCharCode(65+pos),pdfSol:String.fromCharCode(65+pos)+(o.solText?' - '+o.solText:''),
    solutionHTML:o.sol||('Bild <b>'+String.fromCharCode(65+pos)+'</b>')};
  return t;
}
// Kinds-Verteilung nach Schwierigkeit: Stufe 1 -> nur 1, Stufe 2 -> 1 und 2 (2 doppelt), Stufe 3 -> 2 und 3 (3 doppelt)
function genFrom(kinds){var pool=[];kinds.forEach(function(k){for(var i=0;i<(k[0]||1);i++)pool.push(k[1]);});return function(){return pool[rnd(pool.length)]();};}

/* ===== Zeichnen ===== */
var INK='#1f2d2f',GL='#e3f1f4',GL2='#c5dde3',MT='#cdd5d7',MT2='#aebdc0',WATER='#9ed3e8',PORC='#f4efe6',RED='#d0312d',GREEN='#3f9f5f';
function frame(c,s,fn){c.save();c.fillStyle='#fff';c.fillRect(0,0,s,s);c.scale(s/100,s/100);c.lineJoin='round';c.lineCap='round';c.strokeStyle=INK;c.lineWidth=1.5;fn(c);c.restore();}
function path(c,pts,fill,close){c.beginPath();pts.forEach(function(p,i){if(i)c.lineTo(p[0],p[1]);else c.moveTo(p[0],p[1]);});if(close!==false)c.closePath();if(fill){c.fillStyle=fill;c.fill();}c.stroke();}
function rr(c,x,y,w,h,r,fill){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill){c.fillStyle=fill;c.fill();}c.stroke();}
function circ(c,x,y,r,fill){c.beginPath();c.arc(x,y,r,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}c.stroke();}
function ell(c,x,y,rx,ry,fill,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}c.stroke();}
function bar(c,x1,y1,x2,y2,w,fill){var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*w/2,ny=dx/L*w/2;
  path(c,[[x1+nx,y1+ny],[x2+nx,y2+ny],[x2-nx,y2-ny],[x1-nx,y1-ny]],fill);}
function thick(c,pts,w,col,out){c.save();c.lineCap='round';c.lineJoin='round';
  c.beginPath();pts.forEach(function(p,i){if(i)c.lineTo(p[0],p[1]);else c.moveTo(p[0],p[1]);});
  c.strokeStyle=INK;c.lineWidth=w+(out||2.4);c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke();c.restore();}

  /* ---------- Aufgaben zusammenstellen ---------- */
  function sigOf(t){return (t.sub||'')+'|'+(t.pdfQ||t.promptHTML||'')+'|'+(t._kind||'')+(t._num||'')+(t._den||'')+(t._val||'')
    +'|'+String(t.pdfSol||t.answerText||'').replace(/^[A-Z]\s*[-–]\s*/,'');}
  // Anzahl gleichmaessig auf die gewaehlten Unterthemen verteilen, Reihenfolge wie in der Auswahl
  function compose(topics,diff,n,online){
    var k=topics.length,counts=topics.map(function(){return 0;}),i;
    if(n>=k){for(i=0;i<k;i++)counts[i]=Math.floor(n/k);
      var rest=n-Math.floor(n/k)*k,idx=topics.map(function(_,j){return j;}).sort(function(){return Math.random()-0.5;});
      for(i=0;i<rest;i++)counts[idx[i]]++;}
    else{var pickIdx=topics.map(function(_,j){return j;}).sort(function(){return Math.random()-0.5;}).slice(0,n);
      pickIdx.forEach(function(j){counts[j]=1;});}
    var out=[],seen={};
    topics.forEach(function(tp,j){
      for(var c=0;c<counts[j];c++){
        var t=null,g=0;
        while(g++<80){
          var x=tp.gen(diff);
          if(!x)continue;
          if(online&&x.answerType==='custom')continue;      // Zeichenaufgaben nur auf Papier
          var s=sigOf(x);
          if(seen[s]&&g<70)continue;
          seen[s]=1;t=x;break;
        }
        if(t){t.__topic=tp;t.__pts=t.points||1;out.push(t);}
      }
    });
    return out;
  }

  /* ---------- Setup ---------- */
  function mount(host,cfg){
    css();
    cfg.min=cfg.min||4;cfg.max=cfg.max||40;cfg.def=cfg.def||12;
    var all=[];cfg.groups.forEach(function(g){g.topics.forEach(function(t){all.push(t);});});
    var diff=1;
    host.innerHTML='';
    var root=el('div','lk');host.appendChild(root);
    var setup=el('div','lk-card lk-setup');root.appendChild(setup);
    var run=el('div','lk-run');root.appendChild(run);
    var groupsHTML=cfg.groups.map(function(g,gi){
      return (cfg.groups.length>1||g.title?'<div class="lk-grp">'+esc(g.title)+'</div>':'')+
        '<div class="lk-checks">'+g.topics.map(function(t){
          return '<label><input type="checkbox" class="lk-topic" value="'+esc(t.key)+'"'+(cfg.preselect&&cfg.preselect.indexOf(t.key)<0?'':' checked')+'> '+esc(t.nav)+'</label>';}).join('')+'</div>';
    }).join('');
    setup.innerHTML=
      '<div class="lk-row"><b>Themen der Lernkontrolle</b><span class="lk-grow"></span>'+
        '<button class="lk-btn lk-gho" data-a="all">Alle</button><button class="lk-btn lk-gho" data-a="none">Keine</button></div>'+
      groupsHTML+
      '<div class="lk-row">'+
        '<span class="lk-lab" style="margin-left:8px">Anzahl Aufgaben:</span>'+
        '<input class="lk-in lk-count" type="number" min="'+cfg.min+'" max="'+cfg.max+'" value="'+cfg.def+'" style="width:84px" aria-label="Anzahl Aufgaben">'+
        '<span class="lk-lab" style="margin-left:8px">Name:</span>'+
        '<input class="lk-in lk-name" type="text" placeholder="freiwillig" autocomplete="off" style="width:170px" aria-label="Name (freiwillig)"></div>'+
      '<div class="lk-row"><button class="lk-btn lk-pri" data-a="online">Online lösen</button>'+
        '<button class="lk-btn lk-gho" data-a="pdf">Zum Ausdrucken (PDF)</button><span class="lk-hint"></span></div>'+
      '<p class="lk-note"><b>Online:</b> Die Antworten werden erst beim Abgeben ausgewertet – danach folgt eine Auswertung mit Feedback. '+
        '<b>Zum Ausdrucken:</b> Aufgabenblatt mit Punkten je Aufgabe und separates Lösungsblatt.</p>';
    var q=function(s){return setup.querySelector(s);};
    function boxes(){return Array.prototype.slice.call(setup.querySelectorAll('.lk-topic'));}
    function selected(){var k=boxes().filter(function(b){return b.checked;}).map(function(b){return b.value;});
      return all.filter(function(t){return k.indexOf(t.key)>=0;});}
    function count(){return Math.max(cfg.min,Math.min(cfg.max,+q('.lk-count').value||cfg.def));}
    setup.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      var a=b.dataset.a;
      if(a==='all'||a==='none'){boxes().forEach(function(x){x.checked=(a==='all');});return;}
      var st=selected();
      if(!st.length){q('.lk-hint').textContent='Bitte mindestens ein Thema wählen.';return;}
      q('.lk-hint').textContent='';
      var opts={fach:cfg.fach,subject:cfg.subject,diff:diff,n:count(),name:q('.lk-name').value.trim(),topics:st};
      if(a==='online'){startOnline(run,setup,opts);}
      if(a==='pdf'){makePDF(opts);}
    });
  }

  /* ---------- Online lösen ---------- */
  function startOnline(run,setup,o){
    var tasks=compose(o.topics,o.diff,o.n,true);
    if(!tasks.length){run.innerHTML='<p class="lk-hint">Für diese Auswahl konnten keine Aufgaben erzeugt werden.</p>';return;}
    var answers=tasks.map(function(){return null;}),cur=0;
    setup.style.display='none';
    run.innerHTML='';
    var card=el('div','lk-card lk-test');run.appendChild(card);
    card.innerHTML='<div class="lk-head"><span><b>Lernkontrolle</b> · '+esc(o.subject)+'</span><span class="lk-prog"></span></div>'+
      '<div class="lk-dots" role="navigation" aria-label="Aufgaben"></div><p class="lk-sub"></p><div class="lk-stim"></div>'+
      '<div class="lk-q"></div><div class="lk-ans"></div>'+
      '<div class="lk-nav"><button class="lk-btn lk-gho" data-n="prev">← Zurück</button>'+
      '<button class="lk-btn lk-pri" data-n="next">Weiter →</button><span class="lk-grow"></span>'+
      '<button class="lk-btn lk-gho" data-n="quit">Abbrechen</button><button class="lk-btn lk-pri" data-n="submit">Abgeben</button></div>'+
      '<div class="lk-confirm" hidden></div>';
    var q=function(s){return card.querySelector(s);};
    var dots=q('.lk-dots');
    tasks.forEach(function(_,i){var d=el('button','lk-dot',String(i+1));d.dataset.i=i;d.setAttribute('aria-label','Aufgabe '+(i+1));dots.appendChild(d);});
    dots.addEventListener('click',function(e){var d=e.target.closest('.lk-dot');if(!d)return;show(+d.dataset.i);});
    function answered(i){var a=answers[i];return a!=null&&(a.i!=null||(a.v!=null&&String(a.v).trim()!==''));}
    function paintDots(){Array.prototype.forEach.call(dots.children,function(d,i){d.classList.toggle('done',answered(i));d.classList.toggle('cur',i===cur);});
      q('.lk-prog').textContent='Aufgabe '+(cur+1)+' / '+tasks.length+' · beantwortet '+answers.filter(function(_,i){return answered(i);}).length;}
    function show(i){
      cur=Math.max(0,Math.min(tasks.length-1,i));q('.lk-confirm').hidden=true;
      var t=tasks[cur];
      q('.lk-sub').textContent=(t.sub||t.__topic.nav);
      stimInto(q('.lk-stim'),t,t.stimSize||220);
      q('.lk-q').innerHTML=t.promptHTML||'';
      var row=q('.lk-ans');row.innerHTML='';
      if(t.answerType==='mc'){
        var w=el('div','lk-opts');
        t.options.forEach(function(op,k){
          var d=el('div','lk-opt'+(op.draw?'':' txt'));d.tabIndex=0;d.setAttribute('role','button');
          d.setAttribute('aria-label','Auswahl '+String.fromCharCode(65+k));
          if(op.draw){var mk=canvas(op.size||140);op.draw(mk.ctx,op.size||140);d.appendChild(mk.c);d.appendChild(el('div','',String.fromCharCode(65+k)));}
          else d.textContent=op.label;
          if(answers[cur]&&answers[cur].i===k)d.classList.add('sel');
          function pickIt(){answers[cur]={i:k};Array.prototype.forEach.call(w.children,function(x){x.classList.toggle('sel',x===d);});paintDots();}
          d.addEventListener('click',pickIt);
          d.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pickIt();}});
          w.appendChild(d);});
        row.appendChild(w);
      }else if(t.answerType==='buttons'){
        var w2=el('div','lk-choice');
        t.options.forEach(function(op,k){
          var b=el('button','lk-btn lk-gho'+(answers[cur]&&answers[cur].i===k?' sel':''),esc(op.label));
          b.addEventListener('click',function(){answers[cur]={i:k};Array.prototype.forEach.call(w2.children,function(x){x.classList.toggle('sel',x===b);});paintDots();});
          w2.appendChild(b);});
        row.appendChild(w2);
      }else{
        var inp=el('input','lk-in lk-ansin');inp.type='text';inp.placeholder=t.placeholder||'Antwort';
        inp.autocomplete='off';inp.setAttribute('autocorrect','off');inp.autocapitalize='off';inp.spellcheck=false;
        if(t.inputMode)inp.setAttribute('inputmode',t.inputMode);
        inp.setAttribute('aria-label','Antwort zu Aufgabe '+(cur+1));
        inp.value=answers[cur]&&answers[cur].v!=null?answers[cur].v:'';
        inp.addEventListener('input',function(){answers[cur]={v:inp.value};paintDots();});
        inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(cur<tasks.length-1)show(cur+1);else askSubmit();}});
        row.appendChild(inp);
        if(t.unit)row.appendChild(el('span','lk-unit',esc(t.unit)));
        setTimeout(function(){try{inp.focus({preventScroll:true});}catch(e){}},0);
      }
      q('[data-n="prev"]').disabled=cur===0;
      q('[data-n="next"]').disabled=cur===tasks.length-1;
      paintDots();
    }
    function askSubmit(){
      var open=tasks.length-answers.filter(function(_,i){return answered(i);}).length,c=q('.lk-confirm');
      if(!open){finish();return;}
      c.hidden=false;
      c.innerHTML='Noch <b>'+open+'</b> '+(open===1?'Aufgabe':'Aufgaben')+' ohne Antwort. Trotzdem abgeben? '+
        '<span style="display:inline-flex;gap:8px;margin-left:6px"><button class="lk-btn lk-pri" data-n="really">Ja, abgeben</button>'+
        '<button class="lk-btn lk-gho" data-n="stay">Weiter lösen</button></span>';
    }
    function finish(){
      var res=tasks.map(function(t,i){
        var a=answers[i],ok=false,user='';
        if(t.answerType==='mc'||t.answerType==='buttons'){
          if(a&&a.i!=null){ok=!!t.options[a.i].correct;user=t.answerType==='mc'?('Auswahl '+String.fromCharCode(65+a.i)):t.options[a.i].label;}
        }else if(a&&a.v!=null&&String(a.v).trim()!==''){user=String(a.v);try{ok=!!t.accept(a.v);}catch(e){ok=false;}}
        return {t:t,a:a,ok:ok,user:user,empty:!user};
      });
      showResult(run,setup,o,res);
    }
    card.addEventListener('click',function(e){
      var b=e.target.closest('button[data-n]');if(!b)return;
      var n=b.dataset.n;
      if(n==='prev')show(cur-1);
      if(n==='next')show(cur+1);
      if(n==='submit')askSubmit();
      if(n==='really')finish();
      if(n==='stay'){q('.lk-confirm').hidden=true;var f=answers.findIndex(function(_,i){return !answered(i);});show(f<0?cur:f);}
      if(n==='quit'){run.innerHTML='';setup.style.display='';}
    });
    show(0);
    try{run.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
  }
  function stimInto(host,t,size){
    host.innerHTML='';
    if(t.stim){host.style.display='flex';var mk=canvas(size);t.stim(mk.ctx,size);host.appendChild(mk.c);
      if(t.stimLabel)host.appendChild(el('div','lab',esc(t.stimLabel)));}
    else if(t.stimHTML){host.style.display='block';host.innerHTML=t.stimHTML;}
    else host.style.display='none';
  }

  /* ---------- Auswertung mit Feedback ---------- */
  function assess(p){if(p>=90)return ['sicher beherrscht','#1f7a45','#e9f7ef'];if(p>=70)return ['grösstenteils sicher','#846516','#f6efd8'];
    if(p>=50)return ['noch unsicher','#a9631b','#fbeede'];return ['noch nicht sicher','#b23c30','#fdeeec'];}
  function bar(p){return '<span class="lk-bar"><i style="width:'+p+'%;background:'+(p>=70?'#2f9e5f':p>=50?'#e6a23c':'#d5473e')+'"></i></span>';}
  function showResult(run,setup,o,res){
    var maxP=0,got=0,okN=0,emptyN=0,by={},order=[];
    res.forEach(function(r){var tp=r.t.__topic,p=r.t.__pts;maxP+=p;if(r.ok){got+=p;okN++;}if(r.empty)emptyN++;
      if(!by[tp.key]){by[tp.key]={tp:tp,n:0,ok:0,p:0,max:0};order.push(tp.key);}
      var b=by[tp.key];b.n++;b.max+=p;if(r.ok){b.ok++;b.p+=p;}});
    var pct=maxP?Math.round(got/maxP*100):0,a=assess(pct);
    var weak=order.map(function(k){return by[k];}).filter(function(b){return b.ok/b.n<0.8;})
      .sort(function(x,y){return x.ok/x.n-y.ok/y.n;});
    var strong=order.map(function(k){return by[k];}).filter(function(b){return b.ok===b.n;});
    var base=pct>=90?'Sehr gut – die geprüften Themen sitzen.':pct>=70?'Gut – die Themen sind grösstenteils sicher. Schau dir die Fehler unten noch einmal an.'
      :pct>=50?'Die Grundlagen sind vorhanden, aber noch nicht sicher. Übe die unten genannten Themen gezielt weiter.'
      :'Die Themen sitzen noch nicht. Lies die Theorie nochmals durch und übe die Grundaufgaben, bevor du eine neue Lernkontrolle machst.';
    var tips='';
    if(weak.length){tips='<ul class="lk-tips">'+weak.map(function(b){
      return '<li><span>Nochmals üben: <b>'+esc(b.tp.nav)+'</b> ('+b.ok+' von '+b.n+' richtig)</span>'+
        (b.tp.practice?'<button class="lk-btn lk-gho lk-noprint" data-p="'+esc(b.tp.key)+'" style="padding:6px 12px;font-size:13px">Zum Üben →</button>':'')+'</li>';}).join('')+'</ul>';}
    if(strong.length&&weak.length)tips+='<div style="margin-top:6px">Sicher gelöst: '+strong.map(function(b){return esc(b.tp.nav);}).join(', ')+'.</div>';

    if(emptyN)tips+='<div style="margin-top:6px">'+emptyN+' '+(emptyN===1?'Aufgabe wurde':'Aufgaben wurden')+' ohne Antwort abgegeben.</div>';
    var rows=order.map(function(k){var b=by[k],p=Math.round(b.ok/b.n*100);

  /* ---------- Zum Ausdrucken (PDF) ---------- */
  function ascii(s){return String(s).replace(/\u2019/g,"'").replace(/\u2259/g,'=').replace(/\u2192/g,'->')
    .replace(/[\u2013\u2014\u2212]/g,'-').replace(/[\u202f\u2009\u2007\u00a0]/g,' ').replace(/\u2032/g,"'").replace(/[\u2713\u2717]/g,'');}
  function fname(s){return String(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe')
    .replace(/Ü/g,'Ue').replace(/ß/g,'ss').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'Lernkontrolle';}
  function makePDF(o){
    if(!window.jspdf){alert('PDF-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.');return;}
    var tasks=compose(o.topics,o.diff,o.n,false);
    var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=18,PW=210,PH=297,CW=PW-2*M,BOTTOM=PH-14,y;
    var _t=doc.text.bind(doc);
    doc.text=function(txt){var rest=[].slice.call(arguments,1);txt=Array.isArray(txt)?txt.map(ascii):ascii(txt);return _t.apply(null,[txt].concat(rest));};
    var maxP=tasks.reduce(function(s,t){return s+t.__pts;},0);
    var themes=[];tasks.forEach(function(t){if(themes.indexOf(t.__topic.nav)<0)themes.push(t.__topic.nav);});
    function header(tag){doc.setFont('times','normal');doc.setFontSize(10.5);doc.setTextColor(0,0,0);
      doc.text(o.fach||'Mathematik',M,M);doc.setFont('times','italic');doc.text('«Lernkontrolle»',PW/2,M,{align:'center'});
      doc.setFont('times','normal');doc.text(tag,PW-M,M,{align:'right'});doc.setDrawColor(0,0,0);doc.setLineWidth(0.5);doc.line(M,M+2.5,PW-M,M+2.5);}
    function title(tt,withName){var yy=M+13;doc.setFont('times','bold');doc.setFontSize(15);doc.setTextColor(0,0,0);
      doc.text(tt,PW/2,yy,{align:'center'});yy+=5;doc.setFont('times','normal');doc.setFontSize(10);
      var meta=doc.splitTextToSize('Themen: '+themes.join(', ')+' · '+tasks.length+' Aufgaben',CW);
      doc.text(meta,PW/2,yy,{align:'center'});yy+=meta.length*4.4;
      yy+=1;doc.setLineWidth(0.5);doc.line(M,yy,PW-M,yy);
      if(withName){yy+=7;doc.setFont('times','normal');doc.setFontSize(10.5);doc.setDrawColor(120,120,120);doc.setLineWidth(0.3);
        [['Name:',0,74],['Klasse:',80,36],['Datum:',122,52]].forEach(function(c){var x=M+c[1];doc.text(c[0],x,yy);
          doc.line(x+doc.getTextWidth(c[0])+2,yy+1,M+c[1]+c[2],yy+1);});
        yy+=8;doc.setFont('times','bold');doc.text('Punkte:',M,yy);
        var px=M+doc.getTextWidth('Punkte:')+2;doc.line(px,yy+1,px+18,yy+1);doc.setFont('times','normal');doc.text('/ '+maxP,px+20,yy);
        doc.setFont('times','bold');doc.text('Note:',M+80,yy);var nx=M+80+doc.getTextWidth('Note:')+2;doc.line(nx,yy+1,nx+22,yy+1);
        doc.setDrawColor(0,0,0);yy+=2;}
      return yy+7;}
    function img(spec,x,yy,maxW){var w=Math.min(spec.w,maxW||CW),px=Math.max(160,Math.round(w*6)),mk=canvas(px);spec.draw(mk.ctx,px);
      var h=w*(spec.ratio||1);doc.addImage(mk.c.toDataURL('image/png'),'PNG',x,yy,w,h,undefined,'FAST');return h;}

    function qText(t){return t.pdfQ||plain(t.promptHTML);}
    function hasGap(t){return t.answerType==='custom'||(t.answerType!=='mc'&&/_{3,}/.test(qText(t)));}   // custom = Zeichenaufgabe
    function points(p,yy){doc.setFont('times','normal');doc.setFontSize(10);doc.setTextColor(0,0,0);
      doc.text('____ / '+p+' P.',PW-M,yy,{align:'right'});}
    /* --- Kompaktes Raster: nur fuer reine Rechenaufgaben ohne Grafik (z. B. Kopfrechnen) --- */
    doc.setFont('times','normal');doc.setFontSize(11);
    var plainOnly=tasks.every(function(t){return !t.pdfImg&&!t.pdfOpts&&t.answerType!=='buttons'&&t.answerType!=='mc';});
    var longest=0;tasks.forEach(function(t){longest=Math.max(longest,doc.getTextWidth(ascii(qText(t))));});
    var cols=plainOnly?(longest+44<=CW/3?3:(longest+44<=CW/2?2:1)):1;

    header('LK');y=title('Lernkontrolle · '+o.subject,true);
    doc.setFont('times','normal');doc.setFontSize(11);
    doc.text(cols>1?'Löse die Aufgaben. Schreibe das Ergebnis auf die Linie.':'Löse die Aufgaben. Zeige wo nötig deinen Lösungsweg.',M,y);y+=8;

    // Bloecke: je Thema eine Ueberschrift, darunter die Aufgaben
    var blocks=[],num=0;
    themes.forEach(function(th,ti){
      var ts=tasks.filter(function(t){return t.__topic.nav===th;});
      var pts=ts.reduce(function(s,t){return s+t.__pts;},0);
      blocks.push({kind:'head',label:String.fromCharCode(65+ti)+'  '+th,pts:pts,h:9});
      if(cols>1){
        for(var i=0;i<ts.length;i+=cols){
          var row=ts.slice(i,i+cols).map(function(t){num++;return {t:t,n:num};});
          blocks.push({kind:'row',cells:row,h:11});
        }
      }else ts.forEach(function(t){
        num++;
        doc.setFont('times','normal');doc.setFontSize(11);
        var lines=doc.splitTextToSize(ascii(qText(t)),CW-8-28);
        var h=lines.length*5.2+2;

        if(t.pdfOpts)h+=optGeom(t).h+2;
        if(t.answerType==='buttons'){var tw=0;t.options.forEach(function(op){tw+=doc.getTextWidth(op.label)+14;});h+=(tw<=CW-12?8:t.options.length*5.4+2.6);}
        else if(!hasGap(t))h+=10;   // Antwortlinie (entfaellt, wenn die Aufgabe selbst eine Luecke ____ hat)
        blocks.push({kind:'task',t:t,n:num,lines:lines,h:h+4});
      });
    });
    // Kompaktes Raster: passt es mit etwas engeren Zeilen auf eine Seite, dann verdichten
    if(cols>1){var tot=blocks.reduce(function(a,b){return a+b.h;},0),av=BOTTOM-y;

    // Seiten fuellen: Ueberschrift nie allein am Seitenende
    blocks.forEach(function(b,bi){
      var need=b.h+(b.kind==='head'&&blocks[bi+1]?blocks[bi+1].h:0);
      if(y+need>BOTTOM){doc.addPage();header('LK');y=M+8;}
      if(b.kind==='head'){
        var hy=Math.min(4,b.h-4.5);
        doc.setFont('times','bold');doc.setFontSize(12);doc.setTextColor(0,0,0);doc.text(b.label,M,y+hy);
        doc.setFont('times','normal');doc.setFontSize(10);doc.text('____ / '+b.pts+' P.',PW-M,y+hy,{align:'right'});
        doc.setDrawColor(150,150,150);doc.setLineWidth(0.25);doc.line(M,y+hy+2,PW-M,y+hy+2);doc.setDrawColor(0,0,0);
        y+=b.h;return;
      }
      if(b.kind==='row'){
        var cw=CW/cols;
        b.cells.forEach(function(c,k){
          var x=M+k*cw,t=c.t;
          doc.setFont('times','bold');doc.setFontSize(11);doc.text(c.n+')',x,y+5);
          doc.setFont('times','normal');var s=ascii(qText(t));doc.text(s,x+8,y+5);
          var lx=x+8+doc.getTextWidth(s)+2,le=x+cw-14;
          doc.setDrawColor(150,165,190);doc.setLineWidth(0.3);if(le>lx+6)doc.line(lx,y+6,le,y+6);doc.setDrawColor(0,0,0);
          if(t.unit){doc.setFontSize(10);doc.text(ascii(t.unit),le+1,y+5);}
          doc.setFontSize(8.5);doc.setTextColor(110,110,110);doc.text('/'+t.__pts,x+cw-3,y+5,{align:'right'});doc.setTextColor(0,0,0);
        });
        y+=b.h;return;
      }
      var t=b.t,yy=y+4;
      doc.setFont('times','bold');doc.setFontSize(11);doc.setTextColor(0,0,0);doc.text(b.n+')',M,yy);
      doc.setFont('times','normal');doc.text(b.lines,M+8,yy);points(t.__pts,yy);
      yy+=b.lines.length*5.2;
      if(t.pdfImg)yy+=img(t.pdfImg,M+8,yy,CW-8)+3;
      if(t.pdfOpts){var g=optGeom(t);t.pdfOpts.forEach(function(op,k){var px=Math.max(160,Math.round(g.w*6)),mk=canvas(px);op.draw(mk.ctx,px);
          var hh=g.w*(op.ratio||1);doc.addImage(mk.c.toDataURL('image/png'),'PNG',M+8+k*(g.w+4),yy,g.w,hh,undefined,'FAST');
          doc.setFont('times','bold');doc.setFontSize(10);doc.text(String.fromCharCode(65+k),M+8+k*(g.w+4)+g.w/2,yy+hh+4,{align:'center'});});
        yy+=g.h+2;}
      if(t.answerType==='buttons'){doc.setFont('times','normal');doc.setFontSize(10.5);var bx=M+8,tot=0;t.options.forEach(function(op){tot+=doc.getTextWidth(op.label)+14;});
        if(tot<=CW-12){t.options.forEach(function(op){doc.setLineWidth(0.3);doc.rect(bx,yy+1,3.2,3.2);doc.text(op.label,bx+5,yy+4);bx+=doc.getTextWidth(op.label)+14;});yy+=8;}
        else{t.options.forEach(function(op){doc.setLineWidth(0.3);doc.rect(bx,yy+1,3.2,3.2);doc.text(op.label,bx+5,yy+4);yy+=5.4;});yy+=2.6;}}
      else if(!hasGap(t)){doc.setFont('times','normal');doc.setFontSize(10.5);doc.text(t.answerType==='mc'?'Antwort (Buchstabe):':'Antwort:',M+8,yy+6);
        var ax=M+8+doc.getTextWidth(t.answerType==='mc'?'Antwort (Buchstabe):':'Antwort:')+2;
        doc.setDrawColor(150,165,190);doc.setLineWidth(0.3);doc.line(ax,yy+7,ax+62,yy+7);doc.setDrawColor(0,0,0);
        if(t.unit&&t.answerType!=='mc')doc.text(ascii(t.unit),ax+64,yy+6);}

    /* --- Loesungsblatt --- */

    function solLines(t){var s=t.pdfSol;
      if(!s&&t.solutionHTML)s=String(t.solutionHTML).replace(/<br\s*\/?>/g,'\n').replace(/<sup>/g,'^').replace(/<\/sup>/g,'').replace(/<[^>]+>/g,'')

      if(!s)s=t.answerText||'';

    var n2=0;
    themes.forEach(function(th,ti){
      var ts=tasks.filter(function(t){return t.__topic.nav===th;}),pts=ts.reduce(function(s,t){return s+t.__pts;},0);

        var sImg=t.pdfImgSol,h=ql.length*4.8+sl.length*4.6+(sImg?Math.min(sImg.w,60)*(sImg.ratio||1)+3:0)+5;

/* ---- Aufgabenserie ---- */
function sigOf(t){return (t.sub||'')+'|'+(t.pdfQ||'')+'|'+String(t.pdfSol||t.answerText||'');}
function distinct(tp,diff,n){
  var out=[],seen={},tries=0;
  while(out.length<n&&tries<n*60){tries++;var t=tp.gen(diff);var s=sigOf(t);if(seen[s]&&tries<n*45)continue;seen[s]=1;t.__topic=tp;out.push(t);}
  return out;
}
function startSeries(tp){S.ser[tp.key]={tasks:distinct(tp,S.diff[tp.key],10),i:0,res:[],checked:false,sel:null,val:''};}

  if(t.stim){var st=el('div','stim'),mk=mkCanvas(t.stimSize||240);t.stim(mk.ctx,t.stimSize||240);st.appendChild(mk.c);card.appendChild(st);}
  card.appendChild(el('div','q',t.promptHTML));

  var inp=null,optEls=[];
  if(t.answerType==='text'){
    var row=el('div','ansrow');inp=el('input');inp.type='text';inp.placeholder=t.placeholder||'Antwort';inp.autocomplete='off';inp.setAttribute('autocorrect','off');inp.autocapitalize='off';inp.spellcheck=false;
    if(t.inputMode)inp.setAttribute('inputmode',t.inputMode);inp.setAttribute('aria-label','Antwort');row.appendChild(inp);if(t.unit)row.appendChild(el('span','unit',esc(t.unit)));area.appendChild(row);
    inp.addEventListener('input',function(){ser.val=inp.value;});

    setTimeout(function(){try{inp.focus({preventScroll:true});}catch(x){}},0);
  }else{
    var w=el('div','opts'+(t.answerType==='mc'?' pics':''));

      var b=el('button','opt');b.type='button';
      if(op.draw){var mk2=mkCanvas(op.size||130);op.draw(mk2.ctx,op.size||130);b.appendChild(mk2.c);b.appendChild(el('div','',String.fromCharCode(65+k)));b.setAttribute('aria-label','Bild '+String.fromCharCode(65+k));}
      else b.textContent=op.label;
      b.addEventListener('click',function(){if(ser.checked)return;ser.sel=k;optEls.forEach(function(o,j){o.classList.toggle('sel',j===k);});});
      optEls.push(b);w.appendChild(b);});

function asciiPDF(s){return String(s).replace(/[„“”]/g,'"').replace(/[‘’]/g,"'").replace(/→/g,'->').replace(/[–—−]/g,'-').replace(/[    ]/g,' ').replace(/′/g,"'").replace(/[✓✗]/g,'');}

/* ---- Lernkontrolle ---- */
function renderLK(m){
  m.innerHTML='<div class="page-h"><h2>Lernkontrolle</h2></div><p class="muted" style="margin:2px 0 0">Wähle Themen und Anzahl. Die Aufgaben sind gemischt – online lösen oder als PDF ausdrucken.</p><div id="lkhost"></div>';
  var groups=[
   {title:'Überblick und Experimente',keys:['nt','bio','exp','pc']},
   {title:'Mikroskop',keys:['mikro','mik2','praep']},
   {title:'Lebewesen',keys:['zelle','leben','reiche']},
   {title:'Labor',keys:['brenner','geraete']}];
  LK.mount($('#lkhost'),{fach:'Natur und Technik',subject:'Grundlagen Naturwissenschaften',min:4,max:40,def:12,
    groups:groups.map(function(g){return {title:g.title,topics:g.keys.map(function(k){var tp=TOPIC_BY[k];return {key:k,nav:tp.nav,gen:function(d){return tp.gen(d);},practice:function(){go(k,'ueben');}};})};})});
}

/* ---- Start ---- */
document.addEventListener('DOMContentLoaded',function(){
  buildNav();render();
  $('#menu').onclick=function(){$('#nav').classList.toggle('open');};
  window.addEventListener('error',function(e){console.error('Fehler:',e.message);});
});

</script>
